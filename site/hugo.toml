title = "이서준 포트폴리오"
defaultContentLanguage = "ko"

[languages.ko]
  languageName = "한국어"
  locale = "ko-KR"
  weight = 1
[params]
  env = "production"
  description = "전북대학교 컴퓨터공학 전공 이서준의 포트폴리오"
  author = "이서준"
  defaultTheme = "auto"
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  ShowPostNavLinks = true
[params.profileMode]
    enabled = true
    title = "이서준"
    subtitle = "전북대학교 컴퓨터공학 전공 · 웹 서비스와 AI 개발을 공부하는 학생 개발자"
        imageUrl = "images/avatar.svg"
    imageTitle = "이서준 아바타"
    imageWidth = 120
    imageHeight = 120

    [[params.profileMode.buttons]]
      name = "소개"
      url = "about/"
    [[params.profileMode.buttons]]
      name = "프로젝트"
      url = "projects/"
    [[params.profileMode.buttons]]
      name = "학습 기록"
      url = "posts/"

  [[params.socialIcons]]
    name = "github"
    title = "GitHub (leeseojoon5793)"
    url = "https://github.com/leeseojoon5793"
[menu]
  [[menu.main]]
    identifier = "about"
    name = "소개"
    pageRef = "/about"
    weight = 10
  [[menu.main]]
    identifier = "projects"
    name = "프로젝트"
    pageRef = "/projects"
    weight = 20
  [[menu.main]]
    identifier = "posts"
    name = "학습 기록"
    pageRef = "/posts"
    weight = 30

[outputs]
  home = ["HTML", "RSS", "JSON"]